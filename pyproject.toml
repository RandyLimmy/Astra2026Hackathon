[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realitypatch"
version = "0.1.0"
description = "Synthetic braking experiments with an editable Python actuator and MuJoCo mechanics"
requires-python = ">=3.12"
dependencies = [
  "mujoco==3.13.0",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "matplotlib==3.11.1",
  "pillow==12.3.0",
  "openai==3.11.0",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
realitypatch = "simulator.__main__:main"
realitypatch-car = "simulator.__main__:main"
realitypatch-rig = "sim.cli:main"
realitypatch-astra = "investigation.__main__:main"
realitypatch-dashboard = "dashboard.__main__:main"

[tool.setuptools.packages.find]
include = ["sim*", "contracts*", "component_worker*", "reference_host*", "demo*", "evaluation*", "candidate*", "investigation*", "dashboard*"]

[tool.setuptools.package-data]
sim = ["*.xml"]
simulator = ["assets/*.xml", "assets/*.html", "assets/platforms/*.xml", "experiments/*.json", "public/*.xml", "public/*.json", "public/*.md", "private/*.json", "private/scenarios/*.json", "*.md"]
contracts = ["*.md"]
candidate = ["*.json"]
investigation = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
extend-exclude = ["mujoco", ".venv", "runs"]

[tool.mypy]
files = ["simulator"]
exclude = ["^mujoco/", "^runs/"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# MuJoCo exposes its API through native extensions; the adjacent upstream
# checkout otherwise makes mypy resolve it as an empty namespace package.
module = ["mujoco", "mujoco.*"]
follow_imports = "skip"
